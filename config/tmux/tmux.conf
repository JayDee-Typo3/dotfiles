# ============================================================================
#  tmux configuration  —  see README.md for full details
# ----------------------------------------------------------------------------
#  Prefix: Ctrl+Space   (Ctrl+b is unbound)     Theme: Catppuccin (mocha)
#
#  PANES                                    WINDOWS
#    prefix + h/j/k/l   select pane           Shift + ←/→        prev/next window
#    Alt + ←/↓/↑/→      select pane           Ctrl+Alt + h/l     prev/next window
#    prefix + "         split top/bottom
#    prefix + %         split left/right     COPY MODE (vi, enter with prefix + [)
#    Ctrl + h/j/k/l     pane<->vim nav          v      begin selection
#                       (vim-tmux-navigator)     Ctrl+v rectangle select
#                                                y      copy + exit
#  PLUGINS (TPM)
#    prefix + I  install    prefix + U  update    prefix + Alt+u  clean
#
#  NOTE: The window manager (AeroSpace) owns Alt globally. tmux stays on the
#        Ctrl+Space prefix + Ctrl/Shift combos to avoid collisions — that's why
#        window switching uses Ctrl+Alt, not Alt+Shift (AeroSpace = move window).
# ============================================================================

set-option -sa terminal-overrides ",xterm*:Tc"
set -g mouse on

unbind C-b
set -g prefix C-Space
bind C-Space send-prefix

# Vim style pane selection
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Start windows and panes at 1, not 0
set -g base-index 1
set -g pane-base-index 1
set-window-option -g pane-base-index 1
set-option -g renumber-windows on

# Use Alt-arrow keys without prefix key to switch panes
bind -n M-Left select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up select-pane -U
bind -n M-Down select-pane -D

# Shift arrow to switch windows
bind -n S-Left  previous-window
bind -n S-Right next-window

# Ctrl-Alt vim keys to switch windows
# (Alt+Shift is reserved by the window manager / aerospace: move window)
bind -n C-M-h previous-window
bind -n C-M-l next-window

set -g @catppuccin_flavour 'mocha'

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'dreamsofcode-io/catppuccin-tmux'
set -g @plugin 'tmux-plugins/tmux-yank'

run '~/.tmux/plugins/tpm/tpm'

# set vi-mode
set-window-option -g mode-keys vi
# keybindings
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel

bind '"' split-window -v -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"
